<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fff3dc">
    <meta name="color-scheme" content="light">
    <title>Page not found | Elliott</title>
    <link rel="icon" href="/assets/dragon-ball.png" type="image/png" sizes="256x256">
    <link rel="apple-touch-icon" href="/assets/dragon-ball.png" type="image/png" sizes="256x256">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff3dc; color: #132e59; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .error-shell { width: min(960px, calc(100% - 40px)); margin: 0 auto; }
      .error-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 30px 0; border-bottom: 1px solid #dfc9a5; }
      .error-brand { color: #132e59; font: 800 18px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: -.04em; text-decoration: none; }
      .error-brand span { color: #ab3b0c; }
      .error-header p { margin: 0; font-size: 14px; }
      .error-content { display: grid; min-height: 75svh; align-content: center; justify-items: start; padding: 64px 0 90px; }
      .error-code { margin: 0 0 24px; color: #ab3b0c; font: 800 clamp(5rem, 17vw, 9rem)/.9 ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: -.08em; }
      h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.15; letter-spacing: -.045em; }
      .error-message { max-width: 460px; margin: 20px 0 0; color: #53627a; font-size: 17px; line-height: 1.6; }
      .home-link { display: inline-flex; margin-top: 32px; padding: 13px 20px; border: 1px solid #132e59; border-radius: 5px; background: #132e59; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
      .home-link:hover { background: #234b82; }
      a:focus-visible { outline: 3px solid #ab3b0c; outline-offset: 5px; }
      @media (max-width: 480px) { .error-shell { width: calc(100% - 32px); } .error-header { padding: 24px 0; } }
    </style>
  </head>
  <body>
    <div class="error-shell">
      <header class="error-header">
        <a class="error-brand" href="/" aria-label="Elliott, home">EB<span>.</span>EXE</a>
        <p>Elliott</p>
      </header>
      <main class="error-content">
        <p class="error-code" aria-label="Error 404">404</p>
        <h1>Nothing at this address.</h1>
        <p class="error-message">This page may have moved, or the address may be incorrect.</p>
        <a class="home-link" href="/">Back to home <span aria-hidden="true">&nbsp;→</span></a>
      </main>
    </div>
  </body>
</html>
