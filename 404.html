<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#050b18">
    <title>404 | Signal Lost</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .lost-signal { display: grid; min-height: 75svh; place-items: center; padding: 50px 20px; text-align: center; }
      .lost-signal h1 { margin: 0; color: var(--magenta); font-family: Impact, "Arial Black", sans-serif; font-size: clamp(6rem, 24vw, 14rem); line-height: .8; text-shadow: 5px 5px 0 var(--cyan); }
      .lost-signal h2 { color: var(--green); font-size: clamp(1.3rem, 4vw, 2.2rem); }
      .lost-signal p { max-width: 550px; color: var(--muted); }
      .lost-signal a { display: inline-block; margin-top: 18px; border: 2px solid var(--cyan); color: var(--cyan); padding: 12px 18px; font-weight: 900; text-decoration: none; }
      .lost-signal a:hover { background: var(--cyan); color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="crt-shell">
      <div class="crt-screen">
        <header class="site-header">
          <a class="brand" href="/" aria-label="Elliott, home"><span class="brand-prompt">&gt;</span> EB.EXE</a>
          <p class="header-mantra">ERROR <span>★</span> SIGNAL LOST</p>
        </header>
        <main class="lost-signal">
          <div>
            <p>ERR_ROUTE_NOT_FOUND</p>
            <h1>404</h1>
            <h2>THIS SECTOR OF THE INTERNET IS EMPTY.</h2>
            <p>The page may have moved, or perhaps it was only ever a beautiful glitch.</p>
            <a href="/">← RETURN TO BASE</a>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
